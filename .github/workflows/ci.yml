name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev + web extras
        run: python -m pip install -e ".[dev,web]"

      - name: Lint (ruff)
        run: ruff check src/ web/ tests/

      - name: Test (pytest)
        run: pytest -v
